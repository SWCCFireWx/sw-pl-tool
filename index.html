<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWA Preparedness Level</title>
<meta name="description" content="Southwest Area Preparedness Level (PL) calculator: enter fire activity, IMT and crew status, 7-Day outlook and PSA ERCy values to calculate the PL.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--APP-START-->
<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <p class="eyebrow">Southwest Area · Predictive Services</p>
      <h1>SWA Preparedness Level</h1>
      <p class="asof" id="hdr-asof"></p>
    </div>
    <a class="pl-plate" id="hdr-plate" href="#outcome" aria-label="Current preparedness level">
      <span class="pl-big"><span class="pl-label">PL</span><span class="pl-num" id="hdr-pl">–</span></span>
      <span class="pl-score">Score <b id="hdr-score">–</b></span>
    </a>
  </div>
  <nav class="tabs" aria-label="Sections">
    <div class="tabs-inner" id="tabs"></div>
  </nav>
</header>

<main id="main" class="wrap" tabindex="-1"></main>

<footer class="foot wrap">
  <p id="foot-source"></p>
  <p>PL model reproduces <em>2026_SWA_PL_Dashboard_V3_SHOULDER_SEASON_MASTER.xlsx</em>. Weights and thresholds live in <code>js/config.js</code>.</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<!--APP-END-->
<script src="js/config.js"></script>
<script src="js/calc.js"></script>
<script src="js/sources.js"></script>
<script src="js/xlsx-lite.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
